
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Receipt System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Product Receipt System</h1>
        <p class="subtitle">Manage products and calculate your receipt</p>

        <div class="form">
            <h2>Add Product</h2>

            <label>Product Name</label>
            <input type="text" id="name" placeholder="Enter product name">

            <label>Price (AZN)</label>
            <input type="number" id="price" placeholder="Enter price" min="0" step="any">

            <label>Quantity</label>
            <input type="number" id="quantity" placeholder="Enter quantity" min="0" step="1">

            <button onclick="addProduct()">Add Product</button>
            <p id="error"></p>
        </div>

        <div class="receipt">
            <h2>===== RECEIPT =====</h2>

            <div id="productList">
                <p class="empty">No products added yet.</p>
            </div>

            <div class="line"></div>

            <h3>TOTAL: <span id="total">0.00 AZN</span></h3>

            <button class="clear" onclick="clearReceipt()">
                Clear Receipt
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
