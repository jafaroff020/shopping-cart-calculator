
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Receipt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .container {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1976D2;
        }

        #receipt {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .total {
            font-weight: bold;
            border-top: 1px solid #aaa;
            padding-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Product Receipt</h2>

    <input type="text" id="name" placeholder="Product Name">

    <input type="number" id="price" placeholder="Price (AZN)" min="0" step="any">

    <input type="number" id="quantity" placeholder="Quantity" min="0" step="1">

    <button onclick="addProduct()">Add Product</button>

    <div id="receipt">
        <h3>===== RECEIPT =====</h3>
        <div id="products"></div>
        <p class="total">TOTAL: <span id="total">0</span> AZN</p>
    </div>

</div>

<script>
    let products = [];
    let total = 0;

    function addProduct() {
        let name = document.getElementById("name").value.trim();
        let price = Number(document.getElementById("price").value);
        let quantity = Number(document.getElementById("quantity").value);

        if (name === "" ||
            document.getElementById("price").value === "" ||
            document.getElementById("quantity").value === "") {
            alert("Please fill in all fields!");
            return;
        }

        if (price < 0 || quantity < 0 ||
            !Number.isFinite(price) ||
            !Number.isInteger(quantity)) {
            alert("Invalid price or quantity!");
            return;
        }

        if (products.length >= 100) {
            alert("Maximum 100 products allowed!");
            return;
        }

        let subtotal = price * quantity;

        products.push({
            name: name,
            price: price,
            quantity: quantity
        });

        total += subtotal;

        document.getElementById("products").innerHTML +=
            `<p>${name} : ${subtotal.toFixed(2)} AZN</p>`;

        document.getElementById("total").textContent =
            total.toFixed(2);

        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("quantity").value = "";
    }
</script>

</body>
</html>
